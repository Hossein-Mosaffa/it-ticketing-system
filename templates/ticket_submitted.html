<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket submitted | IT Ticketing System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark app-navbar"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('home') }}">IT Ticketing System</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7">
  <div class="card app-card text-center"><div class="card-body p-5">
    <div class="success-icon mb-3"><i class="fa-solid fa-check"></i></div>
    <h1 class="h3 fw-bold">Your ticket has been submitted</h1>
    <p class="text-secondary">Save this tracking code. You will need it with your phone number to check the ticket status.</p>
    <div class="tracking-code my-4">{{ tracking_code }}</div>
    <a class="btn btn-primary" href="{{ url_for('check_status') }}">Track this ticket</a>
    <a class="btn btn-outline-secondary ms-2" href="{{ url_for('home') }}">Submit another ticket</a>
  </div></div>
</div></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
</body>
</html>
