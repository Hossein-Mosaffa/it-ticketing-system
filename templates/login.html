<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | IT Ticketing System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark app-navbar"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('home') }}">IT Ticketing System</a><a class="btn btn-outline-light" href="{{ url_for('home') }}">Client page</a></div></nav>
<main class="container py-5">
  <div class="row justify-content-center"><div class="col-md-6 col-lg-4">
    <div class="card app-card"><div class="card-body p-4">
      <h1 class="h3 fw-bold mb-4 text-center">Admin sign in</h1>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autocomplete="username"></div>
        <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
    </div></div>
  </div></div>
</main>
</body>
</html>
